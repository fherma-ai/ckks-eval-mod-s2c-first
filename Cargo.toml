[package]
name = "ckks-eval-mod-reference"
version = "0.0.0"
edition = "2021"

# The binary the runner starts: ./fherma-solution <point directory>
[[bin]]
name = "fherma-solution"
path = "src/main.rs"

# Reference implementation of eval-mod/s2c: a stage of
# Poulpy's S2C-first pipeline at preset n16_d35_k720_p19_s2c, the configuration
# published at https://www.poulpy.dev/benchmarks/. It is the wrapper: keygen
# and the stage's input are derived from seeds and are not measured; only the
# the stage's call is timed. See README.md.
#
# Targets Poulpy 0.9.0, which redesigned the HAL and changed the seeded noise
# streams: the envelope does not compile against 0.8.3, and the same seed gives
# different bytes.

[dependencies]
poulpy-ckks = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
poulpy-core = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
poulpy-hal = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
poulpy-cpu-portable = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-ckks"] }
sha2 = "0.10"
libc = "0.2" # peak RSS via getrusage, for the report

# The fast backends Poulpy publishes numbers for; one is chosen by a feature.
poulpy-cpu-arm = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-neon", "enable-ckks"], optional = true }
poulpy-cpu-avx = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-avx", "enable-ckks"], optional = true }
poulpy-cpu-avx512 = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-avx512f", "enable-ckks"], optional = true }
rayon = { version = "1", optional = true }

[features]
# Exactly one backend feature. The reference is the fastest one Poulpy has,
# `ifma-rayon` (AVX-512 IFMA on every core), which is what the platform's
# machines run; `ref` is the portable baseline. The `*-rayon` backends run
# the stage on `threads` worker threads; all others are single-threaded.
# Build another backend with
#   cargo build --release --no-default-features --features <backend>
# and, for the SIMD ones, RUSTFLAGS="-C target-cpu=native".
default = ["ifma-rayon"]
ref = []
# Internal: pulled in by every `*-rayon` backend.
threaded = ["dep:rayon"]
neon = ["dep:poulpy-cpu-arm"]
neon-rayon = ["dep:poulpy-cpu-arm", "poulpy-cpu-arm/enable-rayon", "threaded"]
avx = ["dep:poulpy-cpu-avx"]
avx-rayon = ["dep:poulpy-cpu-avx", "poulpy-cpu-avx/enable-rayon", "threaded"]
avx512 = ["dep:poulpy-cpu-avx512"]
avx512-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-rayon", "threaded"]
ifma = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma"]
ifma-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma", "poulpy-cpu-avx512/enable-rayon", "threaded"]

[profile.release]
opt-level = 3
